name: Build BUET Driver APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Capacitor & Android
        run: |
          mkdir -p www
          echo "<html><body>Loading...</body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/background-geolocation@latest
          npx cap init "BUET Driver" "edu.buet.bustracker.driver" --web-dir www
          npx cap add android
      - name: Configure Live URL & Background GPS Permissions
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "edu.buet.bustracker.driver",
            "appName": "BUET Driver",
            "webDir": "www",
            "server": {
              "url": "https://buet-bus-tracker.netlify.app",
              "cleartext": false
            }
          }
          EOF
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = """    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
          """
          open(p, "w").write(s.replace("<application", perms + "    <application", 1))
          '
          npx cap sync android
      - name: Generate Android App Icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#8B151B' --iconBackgroundColorDark '#680E13'
      - name: Build Debug APK
      - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: buet-driver-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
